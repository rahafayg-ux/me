<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px sans-serif; width: 240px; padding: 12px; }
  label { display: block; margin: 8px 0 2px; }
  input, select { width: 100%; box-sizing: border-box; }
</style>
<label><input type="checkbox" id="enabled"> Enabled</label>
<label>Min discount (%)<input type="number" id="thresholdPct" min="0" step="0.5"></label>
<label>Min card price<input type="number" id="minPrice" min="0" step="1000"></label>
<label>Min time left (minutes, 0 = any)<input type="number" id="minMinutes" min="0" step="1"></label>
<label><input type="checkbox" id="hideShort"> Hide listings under the minimum time</label>
<script src="popup.js"></script>
